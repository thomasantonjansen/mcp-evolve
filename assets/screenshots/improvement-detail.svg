<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">MCP Evolve improvement detail</title>
  <desc id="desc">A product preview showing a validated improvement, its workflow steps, inputs, and proof.</desc>
  <defs><linearGradient id="brand" x1="0" x2="1"><stop stop-color="#4f52f7"/><stop offset="1" stop-color="#8e51f5"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#172342" flood-opacity=".12"/></filter></defs>
  <rect width="1400" height="820" rx="18" fill="#f6f7fa"/>
  <rect width="250" height="820" rx="18" fill="#10192a"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(30 34)"><circle cx="25" cy="25" r="24" fill="url(#brand)"/><path d="M12 25h25M17 16l8 9-8 9M30 16l8 9-8 9" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="62" y="23" fill="#fff" font-size="17" font-weight="700">MCP Evolve</text><text x="62" y="43" fill="#8290ad" font-size="11">LOCAL WORKSPACE</text></g>
    <g transform="translate(20 132)" font-size="14"><rect width="210" height="48" rx="9" fill="#202b49" stroke="#4f52f7"/><text x="20" y="30" fill="#fff" font-weight="600">⌁  Improvements</text><text x="20" y="89" fill="#a9b3c9">◷  Runs</text></g><g transform="translate(20 748)" font-size="13"><text x="20" y="0" fill="#a9b3c9">⚙  Settings</text></g>
    <g transform="translate(290 42)"><text x="0" y="28" fill="#101b3a" font-size="30" font-weight="700">Collect repository context</text><text x="0" y="58" fill="#66728f" font-size="14">A validated workflow for the selected GitHub MCP connection.</text><rect x="970" y="0" width="110" height="34" rx="17" fill="#e7f8ee"/><text x="1025" y="22" text-anchor="middle" fill="#16884a" font-size="12" font-weight="700">ACTIVE</text></g>
    <g transform="translate(290 140)" filter="url(#shadow)"><rect width="700" height="600" rx="14" fill="#fff" stroke="#dce2ec"/><g transform="translate(28 30)"><text x="0" y="0" fill="#66728f" font-size="11" font-weight="700" letter-spacing="2">OVERVIEW</text><text x="0" y="38" fill="#101b3a" font-size="19" font-weight="700">One optimized path replaces six MCP calls</text><text x="0" y="68" fill="#66728f" font-size="13">MCP Evolve groups related read-only operations into a reusable, inspectable workflow.</text><line x1="0" y1="100" x2="644" y2="100" stroke="#dce2ec"/><text x="0" y="134" fill="#66728f" font-size="11" font-weight="700" letter-spacing="2">WORKFLOW STEPS</text>
      <g transform="translate(0 158)"><circle cx="18" cy="18" r="18" fill="#4f52f7"/><text x="18" y="23" fill="#fff" text-anchor="middle" font-size="12" font-weight="700">1</text><text x="54" y="16" fill="#101b3a" font-size="14" font-weight="700">List repositories</text><text x="54" y="36" fill="#66728f" font-size="12">github.list_repositories</text><line x1="18" y1="36" x2="18" y2="82" stroke="#b6bfce" stroke-width="2"/></g>
      <g transform="translate(0 240)"><circle cx="18" cy="18" r="18" fill="#4f52f7"/><text x="18" y="23" fill="#fff" text-anchor="middle" font-size="12" font-weight="700">2</text><text x="54" y="16" fill="#101b3a" font-size="14" font-weight="700">Select the target</text><text x="54" y="36" fill="#66728f" font-size="12">Bind repository name to the next step</text><line x1="18" y1="36" x2="18" y2="82" stroke="#b6bfce" stroke-width="2"/></g>
      <g transform="translate(0 322)"><circle cx="18" cy="18" r="18" fill="#15b75b"/><text x="18" y="23" fill="#fff" text-anchor="middle" font-size="12" font-weight="700">3</text><text x="54" y="16" fill="#101b3a" font-size="14" font-weight="700">Read repository details</text><text x="54" y="36" fill="#66728f" font-size="12">github.get_repository</text></g>
      <line x1="0" y1="400" x2="644" y2="400" stroke="#dce2ec"/><text x="0" y="434" fill="#66728f" font-size="11" font-weight="700" letter-spacing="2">PROOF</text><rect x="0" y="456" width="196" height="55" rx="9" fill="#e7f8ee"/><text x="16" y="479" fill="#16884a" font-size="12" font-weight="700">✓ Read-only eligible</text><text x="16" y="497" fill="#16884a" font-size="11">No write tools detected</text><rect x="208" y="456" width="196" height="55" rx="9" fill="#eef1f8"/><text x="224" y="479" fill="#34415e" font-size="12" font-weight="700">✓ Schema validated</text><text x="224" y="497" fill="#66728f" font-size="11">Inputs and bindings mapped</text><rect x="416" y="456" width="196" height="55" rx="9" fill="#eef1f8"/><text x="432" y="479" fill="#34415e" font-size="12" font-weight="700">✓ Test completed</text><text x="432" y="497" fill="#66728f" font-size="11">6 calls reduced to 1</text></g></g>
    <g transform="translate(1020 140)" filter="url(#shadow)"><rect width="330" height="600" rx="14" fill="#fff" stroke="#dce2ec"/><g transform="translate(24 30)"><text x="0" y="0" fill="#101b3a" font-size="17" font-weight="700">Inputs &amp; bindings</text><text x="0" y="28" fill="#66728f" font-size="12">Inspectable workflow contract</text><line x1="0" y1="55" x2="282" y2="55" stroke="#dce2ec"/><text x="0" y="90" fill="#66728f" font-size="11" font-weight="700">INPUT</text><text x="150" y="90" fill="#66728f" font-size="11" font-weight="700">TYPE</text><text x="0" y="122" fill="#101b3a" font-size="13" font-family="Consolas">organization</text><text x="150" y="122" fill="#34415e" font-size="12">string</text><line x1="0" y1="142" x2="282" y2="142" stroke="#dce2ec"/><text x="0" y="176" fill="#101b3a" font-size="13" font-family="Consolas">repository</text><text x="150" y="176" fill="#34415e" font-size="12">string</text><line x1="0" y1="196" x2="282" y2="196" stroke="#dce2ec"/><text x="0" y="236" fill="#66728f" font-size="11" font-weight="700">STATUS</text><rect x="0" y="254" width="282" height="48" rx="8" fill="#e7f8ee"/><text x="16" y="283" fill="#16884a" font-size="13" font-weight="700">Mapped and ready</text><text x="0" y="350" fill="#66728f" font-size="11" font-weight="700">SAVINGS</text><text x="0" y="388" fill="#101b3a" font-size="28" font-weight="700">2.4k</text><text x="92" y="387" fill="#66728f" font-size="12">tokens saved</text><text x="0" y="432" fill="#101b3a" font-size="28" font-weight="700">6 → 1</text><text x="112" y="431" fill="#66728f" font-size="12">MCP calls</text></g></g>
  </g>
</svg>

