<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">MCP Evolve dashboard overview</title>
  <desc id="desc">A product preview showing an agent connected through MCP Evolve to MCP servers and a table of improvements.</desc>
  <defs>
    <linearGradient id="brand" x1="0" x2="1"><stop stop-color="#4f52f7"/><stop offset="1" stop-color="#8e51f5"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#172342" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1400" height="820" rx="18" fill="#f6f7fa"/>
  <rect x="0" y="0" width="250" height="820" rx="18" fill="#10192a"/>
  <g font-family="Segoe UI, Arial, sans-serif">
